name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build
      - name: Dry-run QualityForge Agent
        run: |
          npm run agent -- \
            --id QF-1 \
            --title "Shopper can open the cart" \
            --text "As a shopper I can open the cart from https://example.com" \
            --jira QF-1

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - name: Dry-run Python agent
        run: |
          qualityforge run \
            --id QF-1 \
            --title "Shopper can open the cart" \
            --text "As a shopper I can open the cart from https://example.com" \
            --jira QF-1
